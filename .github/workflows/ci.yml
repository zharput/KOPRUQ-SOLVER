# Builds and tests KOPRUQ-SOLVER in Debug and Release on a GitHub-hosted
# Windows runner with the same MSVC + Ninja + vcpkg toolchain and CMake
# presets used locally. Compiled binaries never touch the developer machine.
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # ninja-asan: full CTest under MSVC AddressSanitizer.
        # ninja-analyze: MSVC /analyze build of project code (no tests); fails on any
        # finding except GoogleTest's C6326 macro false positive in tests\.
        preset: [ninja-debug, ninja-release, ninja-asan, ninja-analyze]
    steps:
      - uses: actions/checkout@v4

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set vcpkg paths
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          "VCPKG_ROOT=$ws/vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$ws/vcpkg-bincache" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg at the manifest baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          git clone --quiet https://github.com/microsoft/vcpkg.git vcpkg
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          git -C vcpkg checkout --quiet $baseline
          ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        if: matrix.preset != 'ninja-analyze'
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Build with static analysis
        if: matrix.preset == 'ninja-analyze'
        shell: pwsh
        run: |
          cmake --build --preset ninja-analyze 2>&1 | Tee-Object -FilePath analyze-build.log
          if ($LASTEXITCODE -ne 0) { throw "analyze build exit $LASTEXITCODE" }
          $hits = Select-String -Path analyze-build.log -Pattern 'warning C(6|26|28|33)\d{3}' |
                  ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          "STATIC-ANALYSIS unique warnings: $($hits.Count)"
          $hits | ForEach-Object { "STATIC-ANALYSIS $_" }
          $hits | Set-Content analyze-warnings.txt
          # Known false positive: GoogleTest assertion macros expand to
          # `switch (0) case 0: default:`, which /analyze reports as C6326 on
          # every assertion line. Only that code, only in tests\, is tolerated;
          # it stays visible above. Any other finding fails the job.
          $blocking = $hits | Where-Object { -not ($_ -match '\\tests\\' -and $_ -match 'warning C6326') }
          "STATIC-ANALYSIS blocking findings: $(@($blocking).Count)"
          if (@($blocking).Count -gt 0) { $blocking; throw "static analysis findings" }

      - name: Test inventory
        if: matrix.preset != 'ninja-analyze'
        run: ctest --preset ${{ matrix.preset }} -N

      - name: Test
        if: matrix.preset != 'ninja-analyze'
        run: ctest --preset ${{ matrix.preset }} --output-junit ctest-junit.xml

      - name: CLI smoke test
        if: matrix.preset == 'ninja-release'
        shell: pwsh
        run: |
          $cli = "build/release/kopruq_solver_cli.exe"
          & $cli --version; if ($LASTEXITCODE -ne 0) { throw "--version exit $LASTEXITCODE" }
          & $cli --help;    if ($LASTEXITCODE -ne 0) { throw "--help exit $LASTEXITCODE" }
          & $cli bogus;     if ($LASTEXITCODE -ne 2) { throw "unknown command: expected exit 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Benchmarks
        if: matrix.preset == 'ninja-release'
        shell: pwsh
        run: |
          & build/release/kopruq_sparse_assembly_benchmark.exe | Tee-Object -FilePath benchmark-sparse-assembly.txt
          if ($LASTEXITCODE -ne 0) { throw "sparse assembly benchmark exit $LASTEXITCODE" }
          & build/release/kopruq_solver_benchmark.exe | Tee-Object -FilePath benchmark-solver.txt
          if ($LASTEXITCODE -ne 0) { throw "solver benchmark exit $LASTEXITCODE" }

      - name: Upload test and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.preset }}
          path: |
            build/*/ctest-junit.xml
            build/*/Testing/Temporary/LastTest.log
            benchmark-*.txt
            analyze-*.txt
            analyze-*.log
          if-no-files-found: ignore
