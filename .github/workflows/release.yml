# Windows .exe production and the MSVC-specific verification that only
# makes sense on the real toolchain (/analyze, MSVC AddressSanitizer, the
# actual Windows binaries). Deliberately NOT run on every push: see
# docs/DEVELOPMENT_STATUS.md for why (every-push Windows CI exhausted the
# GitHub Free plan's monthly Actions-minute allowance in under a day).
# Routine Debug/Release/ASan verification on every push lives in ci.yml, on
# ubuntu-latest, at 1x the per-minute cost of a Windows runner.
#
# Build commands, flags, CMake presets and packaging (vcpkg applocal DLL
# copying into build/release) are unchanged from before this split; this
# workflow only changes *when* the Windows job runs and adds artifact
# upload for the built .exe files.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

# Queues (does not cancel) a second dispatch/tag for the same ref: unlike
# ci.yml's routine runs, a half-finished release build being silently
# cancelled is more surprising than useful, and releases are infrequent
# enough that queuing is never a real wait.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # ninja-asan: full CTest under MSVC AddressSanitizer.
        # ninja-analyze: MSVC /analyze build of project code (no tests); fails on any
        # finding except GoogleTest's C6326 macro false positive in tests\.
        # ninja-gui-release: Qt6 verification GUI (apps/verification-gui) -- the only preset
        # that requests vcpkg's "gui" manifest feature (qtbase), so this job is the deliberate
        # verification path for the GUI chosen over adding Qt6 to every-push ci.yml, per the
        # user's 2026-10-20 decision; see docs/SOLVER_ROADMAP.md's "QT6 VERIFICATION GUI"
        # section 14.
        preset: [ninja-debug, ninja-release, ninja-asan, ninja-analyze, ninja-gui-release]
    steps:
      - uses: actions/checkout@v4

      - name: MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set vcpkg paths
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          "VCPKG_ROOT=$ws/vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$ws/vcpkg-bincache" >> $env:GITHUB_ENV

      # Caches the vcpkg tool itself (its git clone + compiled bootstrap executable),
      # separate from the built-package cache below -- on a hit this skips a full
      # clone and bootstrap compile entirely. Same technique as ci.yml's Linux job.
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg at the manifest baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-bincache | Out-Null
          if (-not (Test-Path vcpkg/vcpkg.exe)) {
            git clone --quiet https://github.com/microsoft/vcpkg.git vcpkg
            $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
            git -C vcpkg checkout --quiet $baseline
            ./vcpkg/bootstrap-vcpkg.bat -disableMetrics
          }

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        if: matrix.preset != 'ninja-analyze'
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Build with static analysis
        if: matrix.preset == 'ninja-analyze'
        shell: pwsh
        run: |
          cmake --build --preset ninja-analyze 2>&1 | Tee-Object -FilePath analyze-build.log
          if ($LASTEXITCODE -ne 0) { throw "analyze build exit $LASTEXITCODE" }
          $hits = Select-String -Path analyze-build.log -Pattern 'warning C(6|26|28|33)\d{3}' |
                  ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          "STATIC-ANALYSIS unique warnings: $($hits.Count)"
          $hits | ForEach-Object { "STATIC-ANALYSIS $_" }
          $hits | Set-Content analyze-warnings.txt
          # Known false positive: GoogleTest assertion macros expand to
          # `switch (0) case 0: default:`, which /analyze reports as C6326 on
          # every assertion line. Only that code, only in tests\, is tolerated;
          # it stays visible above. Any other finding fails the job.
          $blocking = $hits | Where-Object { -not ($_ -match '\\tests\\' -and $_ -match 'warning C6326') }
          "STATIC-ANALYSIS blocking findings: $(@($blocking).Count)"
          if (@($blocking).Count -gt 0) { $blocking; throw "static analysis findings" }

      - name: Test inventory
        if: matrix.preset != 'ninja-analyze'
        run: ctest --preset ${{ matrix.preset }} -N

      - name: Test
        if: matrix.preset != 'ninja-analyze'
        run: ctest --preset ${{ matrix.preset }} --output-junit ctest-junit.xml

      - name: CLI smoke test
        if: matrix.preset == 'ninja-release'
        shell: pwsh
        run: |
          $cli = "build/release/kopruq_solver_cli.exe"
          & $cli --version; if ($LASTEXITCODE -ne 0) { throw "--version exit $LASTEXITCODE" }
          & $cli --help;    if ($LASTEXITCODE -ne 0) { throw "--help exit $LASTEXITCODE" }
          & $cli bogus;     if ($LASTEXITCODE -ne 2) { throw "unknown command: expected exit 2, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: GUI smoke test (launches, stays alive, closed cleanly)
        if: matrix.preset == 'ninja-gui-release'
        shell: pwsh
        run: |
          $exe = "build/gui-release/kopruq_verification_gui.exe"
          if (-not (Test-Path $exe)) { throw "$exe was not built" }
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "GUI process exited on its own within 5s (exit code $($p.ExitCode)) -- treat as a crash, not success" }
          Stop-Process -Id $p.Id -Force
          "GUI launched and stayed alive for 5s, then was closed cleanly."

      - name: Upload GUI executable
        if: matrix.preset == 'ninja-gui-release'
        uses: actions/upload-artifact@v4
        with:
          name: kopruq-verification-gui-windows-x64
          path: |
            build/gui-release/kopruq_verification_gui.exe
            build/gui-release/resources/
          if-no-files-found: error

      - name: Benchmarks
        if: matrix.preset == 'ninja-release'
        shell: pwsh
        run: |
          & build/release/kopruq_sparse_assembly_benchmark.exe | Tee-Object -FilePath benchmark-sparse-assembly.txt
          if ($LASTEXITCODE -ne 0) { throw "sparse assembly benchmark exit $LASTEXITCODE" }
          & build/release/kopruq_solver_benchmark.exe | Tee-Object -FilePath benchmark-solver.txt
          if ($LASTEXITCODE -ne 0) { throw "solver benchmark exit $LASTEXITCODE" }

      # The actual shippable product: the CLI and the two benchmark executables, unmodified
      # from what the Release build already produces. Deliberately excludes the GoogleTest
      # test executables (and their gtest*.dll) that also land in build/release/ -- those are
      # verification artifacts, not part of the product. None of the three need a DLL: Eigen
      # and nlohmann-json are header-only, so vcpkg applocal has nothing to copy for them.
      - name: Upload Windows executables
        if: matrix.preset == 'ninja-release'
        uses: actions/upload-artifact@v4
        with:
          name: kopruq-solver-windows-x64
          path: |
            build/release/kopruq_solver_cli.exe
            build/release/kopruq_solver_benchmark.exe
            build/release/kopruq_sparse_assembly_benchmark.exe
          if-no-files-found: error

      - name: Upload test and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.preset }}
          path: |
            build/*/ctest-junit.xml
            build/*/Testing/Temporary/LastTest.log
            benchmark-*.txt
            analyze-*.txt
            analyze-*.log
          if-no-files-found: ignore

  # GUI-7: Ubuntu build of the Qt6 verification GUI, same manual-dispatch-only reasoning as the
  # Windows gui preset above -- a separate job (not folded into build-test's matrix) because it
  # needs a different OS entirely. The GUI itself has no Windows-specific code, so this is the
  # cross-platform half of GUI-7's acceptance criteria. Qt6 Widgets needs an actual X server to
  # even open on Linux (no headless/offscreen fallback is assumed here); xvfb-run provides a
  # virtual one so the launch smoke test is real, not skipped.
  build-test-linux-gui:
    name: gcc-gui-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # qtbase builds X11/XCB/OpenGL support from source (vcpkg, not a system Qt), so it needs
      # the matching *-dev packages at configure time, not just the runtime .so files the GUI
      # smoke test needs later -- this is Qt's own standard Linux X11 build dependency list.
      - name: Install Ninja, Qt6/X11 build+runtime packages, and vcpkg's autotools deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build xvfb \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev libxrender-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-cursor-dev libxcb-glx0-dev libxcb-keysyms1-dev \
            libxcb-image0-dev libxcb-shm0-dev libxcb-icccm4-dev libxcb-sync-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev libxcb-randr0-dev libxcb-render-util0-dev \
            libxcb-xinerama0-dev libxcb-xkb-dev libxcb-util-dev libxcb-cursor0 \
            libxcb-xinput-dev \
            libsm-dev libice-dev libfontconfig1-dev libfreetype-dev

      - name: Set vcpkg paths
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-bincache" >> "$GITHUB_ENV"

      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-gcc-gui-release-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg at the manifest baseline
        run: |
          mkdir -p vcpkg-bincache
          if [ ! -x vcpkg/vcpkg ]; then
            git clone --quiet https://github.com/microsoft/vcpkg.git vcpkg
            baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
            git -C vcpkg checkout --quiet "$baseline"
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        run: cmake --preset gcc-gui-release

      - name: Build
        run: cmake --build --preset gcc-gui-release

      - name: Test inventory
        run: ctest --preset gcc-gui-release -N

      - name: Test
        run: ctest --preset gcc-gui-release --output-junit ctest-junit.xml

      - name: GUI smoke test under xvfb (launches, stays alive, closed cleanly)
        run: |
          exe="build/linux-gui-release/kopruq_verification_gui"
          if [ ! -x "$exe" ]; then echo "$exe was not built"; exit 1; fi
          xvfb-run -a "$exe" &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "GUI process exited on its own within 5s -- treat as a crash, not success"
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "GUI launched and stayed alive for 5s, then was closed cleanly."

      - name: Upload GUI executable
        uses: actions/upload-artifact@v4
        with:
          name: kopruq-verification-gui-linux-x64
          path: |
            build/linux-gui-release/kopruq_verification_gui
            build/linux-gui-release/resources/
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-gcc-gui-release
          path: |
            build/linux-gui-release/ctest-junit.xml
            build/linux-gui-release/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
