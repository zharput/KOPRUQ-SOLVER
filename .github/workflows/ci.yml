# Fast, cheap correctness verification on every push/PR, on a Linux runner
# (1x Actions-minute multiplier vs. 2x for Windows). The project has no
# Windows-specific source code (verified: no _MSC_VER/Windows.h/__declspec),
# so GCC/Clang on Ubuntu exercises the same C++20 source and GTest suites as
# the Windows build. MSVC-specific checks (the real Windows .exe, /analyze,
# the CLI smoke test and benchmarks against that real binary) live in
# release.yml instead, gated to manual dispatch / version tags, not every
# push -- see docs/DEVELOPMENT_STATUS.md for why (Windows-runner minutes
# exhausted the GitHub Free plan's monthly allowance within one day of
# every-push Windows CI).
name: CI

on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gcc-asan: full CTest under GCC/Clang AddressSanitizer + UndefinedBehaviorSanitizer.
        preset: [gcc-debug, gcc-release, gcc-asan]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update -y && sudo apt-get install -y ninja-build

      - name: Set vcpkg paths
        run: |
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$GITHUB_WORKSPACE/vcpkg-bincache" >> "$GITHUB_ENV"

      # Caches the vcpkg tool itself (its git clone + compiled bootstrap executable),
      # separate from the built-package cache below -- on a hit this skips a full
      # clone and bootstrap compile entirely. Keyed on vcpkg.json so it is invalidated
      # exactly when the pinned baseline changes.
      - name: Restore vcpkg tool cache
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ matrix.preset }}-${{ hashFiles('vcpkg.json') }}

      - name: Bootstrap vcpkg at the manifest baseline
        run: |
          mkdir -p vcpkg-bincache
          if [ ! -x vcpkg/vcpkg ]; then
            git clone --quiet https://github.com/microsoft/vcpkg.git vcpkg
            baseline=$(jq -r '."builtin-baseline"' vcpkg.json)
            git -C vcpkg checkout --quiet "$baseline"
            ./vcpkg/bootstrap-vcpkg.sh -disableMetrics
          fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test inventory
        run: ctest --preset ${{ matrix.preset }} -N

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-junit ctest-junit.xml

      - name: CLI smoke test
        if: matrix.preset == 'gcc-release'
        run: |
          cli=build/linux-release/kopruq_solver_cli
          "$cli" --version
          "$cli" --help
          "$cli" bogus; code=$?
          if [ "$code" -ne 2 ]; then echo "unknown command: expected exit 2, got $code"; exit 1; fi

      - name: Benchmarks
        if: matrix.preset == 'gcc-release'
        run: |
          build/linux-release/kopruq_sparse_assembly_benchmark | tee benchmark-sparse-assembly.txt
          build/linux-release/kopruq_solver_benchmark | tee benchmark-solver.txt

      - name: Upload test and benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.preset }}
          path: |
            build/*/ctest-junit.xml
            build/*/Testing/Temporary/LastTest.log
            benchmark-*.txt
          if-no-files-found: ignore
