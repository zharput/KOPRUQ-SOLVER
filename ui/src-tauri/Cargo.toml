[package]
name = "kopruq-solver-ui"
version = "0.1.0"
description = "KOPRUQ-SOLVER desktop GUI (Tauri 2 shell around the C++ CLI)"
edition = "2021"

[lib]
name = "kopruq_solver_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
